{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Logs</title>
        <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    </head>
    <body>
        <button id="btn-perfil" class="btn-perfil" type="button">☰</button>
        <div class="contenedorperfilmenucerrarsesion oculto" id="panel-perfil">
                    <p>Perfil</p>
                    <p><a href="{% url 'inicio' %}">Menu</a></p>
                    <p>Cerrar sesión</p>
                    
        </div>   
        <div class="contenedorwelcome">
            <h1>Consulta de logs</h1>

            <table class="table-user">
                <thead>
                    <!-- tr table row -->
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Nombre</th>
                        <th>Módulo</th>
                    </tr>
                </thead>
                <tbody>
                    {% for log in logs %}
                    <tr>
                        <td>{{ log.id}}</td>
                        <td>{{ log.date}}</td>
                        <td>{{ log.description}}</td>
                        <td> {{ log.user_name }} </td>
                        <td>{{ log.module}}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <script src="{% static 'hello/js/scripts.js' %}"></script>
    </body>
</html>
