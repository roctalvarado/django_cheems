{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registro</title>
        <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    </head>
    <body>
        <div class="contenedor-login">
            <h1>Crear cuenta</h1>

            {% if error %}
                <p>{{ error }}</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <p>
                    <label for="name">Nombre</label>
                    <input type="text" id="name" name="name" value="{{ name }}" maxlength="45" required>
                </p>
                <p>
                    <label for="account">Cuenta</label>
                    <input type="text" id="account" name="account" value="{{ account }}" maxlength="45" required>
                </p>
                <p>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </p>
                <p>
                    <label for="password2">Confirmar contraseña</label>
                    <input type="password" id="password2" name="password2" required>
                </p>
                <button type="submit">Registrarme</button>
            </form>

            <p><a href="{% url 'login' %}">¿Ya tienes cuenta? Inicia sesión</a></p>
        </div>
    </body>
</html>
