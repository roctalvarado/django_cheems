{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
        <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    </head>
    <body>
        <div class="contenedorwelcome">
            <h1>Login</h1>

            {% if error %}
                <p>{{ error }}</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <p>
                    <label for="account">Cuenta</label>
                    <input type="text" id="account" name="account" value="{{ account }}" maxlength="45" required>
                </p>
                <p>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </p>
                <button type="submit">Iniciar sesión</button>
            </form>
        </div>
    </body>
</html>
