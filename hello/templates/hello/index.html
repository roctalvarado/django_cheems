{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Órdenes de Trabajo</title>
        <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    </head>
    
    <body>
       
        <button id="btn-perfil" class="btn-perfil" type="button">☰</button>

        <div class="contenedorperfilmenucerrarsesion oculto" id="panel-perfil">
                    <p>Perfil</p>
                    <p><a href="{% url 'inicio' %}">Menu</a></p>
                    <p>Cerrar sesión</p>
                    
        </div>   
        <div class="contenedorwelcome">
            <h1>Consulta de órdenes de trabajo</h1>
            <table class="table-user">
                <thead>
                    <!-- tr table row -->
                    <tr>
                        <th>Nombre</th>
                        <th>Cuenta</th>
                        <th>Perfil</th>
                    </tr>
                </thead>
                <tbody>
                    <tbody>
                        {% for user in users %}
                        <tr>
                            <td>{{ user.name }}</td>
                            <td>{{ user.account }}</td>
                            <td>{{ user.profile.name }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </tbody>
            </table>
        </div>
        <script src="{% static 'hello/js/scripts.js' %}"></script>
    </body>
</html>
