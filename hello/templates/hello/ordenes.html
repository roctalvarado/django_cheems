{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Órdenes</title>
    <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
  </head>
  <body>
    <button id="btn-perfil" class="btn-perfil" type="button">☰</button>
    <div class="contenedorperfilmenucerrarsesion oculto" id="panel-perfil">
      <p>Perfil</p>
      <p><a href="{% url 'inicio' %}">Menu</a></p>
      <p>Cerrar sesión</p>
                     
    </div> 
    <div class="contenedorwelcome">  
      <h1>Lista de órdenes</h1>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Estado</th>
            
          </tr>
        </thead>
        <tbody>
          {% for orden in ordenes %}
          <tr>
            <td>{{ orden.id }}</td>
            <td>{{ orden.title }}</td>
            <td>{{ orden.description }}</td>
            <td>{{ orden.status }}</td>
            
          </tr>
          {% empty %}
          <tr><td colspan="5">No hay órdenes registradas</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <script src="{% static 'hello/js/scripts.js' %}"></script>
  </body>
</html>
